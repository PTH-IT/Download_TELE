<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Telegram Transfer</title>
    <style>
      :root {
        --bg: #07111d;
        --panel: rgba(12, 24, 39, 0.92);
        --line: rgba(255,255,255,0.08);
        --text: #eff4fb;
        --muted: #7f8ca3;
        --accent: #66e0ff;
        --good: #74f0b7;
        --bad: #ff6b6b;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
        background: linear-gradient(135deg, #07111d 0%, #0b1825 100%);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .login-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 32px;
        max-width: 400px;
        width: 100%;
        box-shadow: 0 18px 60px rgba(0,0,0,0.24);
      }

      h1 {
        margin: 0 0 20px;
        font-size: 1.5rem;
        font-weight: 700;
      }

      .input-group {
        margin-bottom: 16px;
      }

      .input-group label {
        display: block;
        color: var(--muted);
        font-size: 0.85rem;
        margin-bottom: 6px;
      }

      .input-group input {
        width: 100%;
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.06);
        color: var(--text);
        font-size: 1rem;
      }

      .btn {
        width: 100%;
        padding: 12px 16px;
        border: 0;
        border-radius: 999px;
        font-weight: 700;
        cursor: pointer;
        background: linear-gradient(90deg, var(--accent), #3cb7e0);
        color: var(--text);
        font-size: 1rem;
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .error {
        color: var(--bad);
        font-size: 0.9rem;
        margin-top: 12px;
        min-height: 1.2em;
      }

      .otp-section {
        display: none;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <div class="login-panel">
      <h1>Telegram Login</h1>
      <div class="input-group">
        <label for="phone">Phone Number</label>
        <input id="phone" type="tel" placeholder="+84987379557" />
      </div>
      <button class="btn" id="btnSendCode">Send Code</button>
      
      <div class="otp-section" id="otpSection">
        <div class="input-group" style="margin-top:16px;">
          <label for="otp">OTP Code</label>
          <input id="otp" type="text" placeholder="Enter code from Telegram" />
        </div>
        <div class="input-group" style="margin-top:16px;">
          <label for="password">Mật khẩu 2FA (chỉ khi tài khoản bật xác minh 2 bước)</label>
          <input id="password" type="password" placeholder="Bỏ trống nếu không bật 2FA" />
        </div>
        <button class="btn" id="btnVerify" style="margin-top:12px;">Verify</button>
      </div>
      
      <div class="error" id="errorMsg"></div>
    </div>

    <script src="config.js?v=3"></script>
<script>
      const API_BASE = (window.API_BASE || "").replace(/\/$/, "");

      document.getElementById("btnSendCode").addEventListener("click", async () => {
        const phone = document.getElementById("phone").value.trim();
        const errorEl = document.getElementById("errorMsg");
        
        if (!phone) {
          errorEl.textContent = "Phone number required";
          return;
        }

        errorEl.textContent = "";
        document.getElementById("btnSendCode").disabled = true;
        
        try {
          const res = await fetch(`${API_BASE}/api/auth/request`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone_number: phone }),
          });
          
          if (!res.ok) throw new Error(`Failed: ${res.status}`);

          // Show OTP section
          document.getElementById("otpSection").style.display = "block";
          document.getElementById("phone").readOnly = true;

          // Worker mới là bên thực sự gửi OTP — hiện lỗi nếu nó báo về
          for (let i = 0; i < 8; i++) {
            await new Promise(r => setTimeout(r, 1000));
            const st = await (await fetch(`${API_BASE}/api/auth/state`)).json();
            if (st.error) { errorEl.textContent = st.error; break; }
          }
        } catch (e) {
          errorEl.textContent = e.message || "Failed to send code";
          document.getElementById("btnSendCode").disabled = false;
        }
      });

      document.getElementById("btnVerify").addEventListener("click", async () => {
        const phone = document.getElementById("phone").value.trim();
        const otp = document.getElementById("otp").value.trim();
        const errorEl = document.getElementById("errorMsg");
        
        if (!otp) {
          errorEl.textContent = "OTP required";
          return;
        }

        errorEl.textContent = "";
        document.getElementById("btnVerify").disabled = true;
        
        try {
          const res = await fetch(`${API_BASE}/api/auth/verify`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              phone_number: phone,
              otp,
              password: document.getElementById("password").value.trim(),
            }),
          });
          
          if (!res.ok) throw new Error(`Failed: ${res.status}`);
          
          // Poll for session state
          let attempts = 0;
          while (attempts < 30) {
            const stateRes = await fetch(`${API_BASE}/api/auth/state`);
            const state = await stateRes.json();
            
            if (state.authenticated) {
              window.location.href = "/index.html";
              return;
            }
            if (state.error) {
              errorEl.textContent = state.error;
              document.getElementById("btnVerify").disabled = false;
              return;
            }

            await new Promise(r => setTimeout(r, 1000));
            attempts++;
          }
          
          errorEl.textContent = "Authentication timeout, please try again";
          document.getElementById("btnVerify").disabled = false;
        } catch (e) {
          errorEl.textContent = e.message || "Verification failed";
          document.getElementById("btnVerify").disabled = false;
        }
      });
    </script>
  </body>
</html>
